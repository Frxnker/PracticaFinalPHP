services:
  web:
    image: php:8.3-apache
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html        # tu código PHP local se monta en Apache
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: miapp
      MYSQL_USER: usuario
      MYSQL_PASSWORD: usuario
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql      # los datos no se pierden al borrar el contenedor
      - ./sql:/docker-entrypoint-initdb.d   # .sql que se ejecutan la primera vez

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: